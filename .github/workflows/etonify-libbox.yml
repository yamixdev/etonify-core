name: Etonify libbox

on:
  push:
    branches:
      - etonify-dev
      - update/upstream-v1.14.0-rc1
    paths:
      - '.github/workflows/etonify-libbox.yml'
      - 'adapter/**'
      - 'cmd/**'
      - 'common/**'
      - 'constant/**'
      - 'daemon/**'
      - 'dns/**'
      - 'experimental/libbox/**'
      - 'log/**'
      - 'option/**'
      - 'protocol/**'
      - 'release/**'
      - 'route/**'
      - 'service/**'
      - 'transport/**'
      - 'box.go'
      - 'debug*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  pull_request:
    branches:
      - etonify-dev
      - update/upstream-v1.14.0-rc1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etonify-libbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Verify baseline
        run: bash release/verify_etonify_baseline.sh
      - name: Verify libbox version source
        run: go test ./cmd/internal/build_libbox
      - name: Test
        run: go test ./...
      - name: Validate Android configuration corpus
        run: >-
          go test
          -tags "with_gvisor,with_quic,with_wireguard,with_utls"
          -run 'TestEtonify(AndroidConfigCorpus|NaiveConfigSchema)'
          ./experimental/libbox
      - name: Race test Etonify runtime paths
        run: >-
          go test -race
          ./common/interrupt
          ./common/urltest
          ./daemon
          ./experimental/libbox
          ./protocol/group
          ./protocol/vless/...
          ./transport/v2rayxhttp
      - name: Race test QUIC runtime paths
        run: go test -race -tags with_quic ./dns/transport/quic ./transport/v2rayquic
      - name: Resource and performance gate
        run: bash release/verify_etonify_performance.sh

  android:
    name: Build verified Android AAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28
      - name: Verify baseline
        run: bash release/verify_etonify_baseline.sh
      - name: Install pinned gomobile
        run: make lib_install
      - name: Build libbox
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make lib_android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Verify ARM-only AAR
        shell: bash
        run: |
          set -euo pipefail
          source release/ETONIFY_BASELINE
          actual_abis="$(unzip -Z1 libbox.aar \
            | sed -n 's#^jni/\([^/]*\)/libbox\.so$#\1#p' \
            | sort \
            | paste -sd, -)"
          expected_abis="$(tr ',' '\n' <<< "$LIBBOX_ANDROID_ABIS" | sort | paste -sd, -)"
          if [ "$actual_abis" != "$expected_abis" ]; then
            echo "::error title=Unexpected libbox ABI set::Expected $expected_abis, got $actual_abis"
            exit 1
          fi
      - name: Prepare provenance
        shell: bash
        run: |
          set -euo pipefail
          source release/ETONIFY_BASELINE
          etonify_version="$(tr -d '\r\n' < release/ETONIFY_VERSION)"
          test -f libbox.aar
          test -f libbox-sources.jar
          mkdir -p dist
          cp libbox.aar libbox-sources.jar dist/
          sha256sum libbox.aar > dist/libbox.sha256
          git archive --format=tar HEAD | gzip -n > dist/etonify-core-source.tar.gz
          commit="$(git rev-parse HEAD)"
          version="$(git describe --tags --always --dirty)"
          go_actual="$(go version)"
          java_actual="$(java --version 2>&1 | head -n 1)"
          cat > dist/libbox.provenance.json <<EOF
          {
            "artifact": "libbox.aar",
            "sha256": "$(sha256sum libbox.aar | awk '{print $1}')",
            "source_commit": "${commit}",
            "source_version": "${version}",
            "etonify_version": "${etonify_version}",
            "upstream_commit": "${UPSTREAM_COMMIT}",
            "go": "${go_actual}",
            "gomobile": "${GOMOBILE_VERSION}",
            "java": "${java_actual}",
            "android_ndk": "${ANDROID_NDK_VERSION}",
            "android_api": ${LIBBOX_ANDROID_API},
            "android_abis": ["${LIBBOX_ANDROID_ABIS//,/\", \"}"],
            "build_tags": "${LIBBOX_BUILD_TAGS}"
          }
          EOF
      - name: Upload libbox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etonify-libbox-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare draft Android test release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/etonify-dev' || github.ref == 'refs/heads/update/upstream-v1.14.0-rc1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: android
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Download verified libbox artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: etonify-libbox-${{ github.sha }}
          path: dist
      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check libbox.sha256)
          version="$(tr -d '\r\n' < release/ETONIFY_VERSION)"
          jq --exit-status --arg commit "$GITHUB_SHA" --arg version "$version" \
            '.source_commit == $commit and .etonify_version == $version' \
            dist/libbox.provenance.json >/dev/null
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/ETONIFY_VERSION)"
          test -n "$version"
          title="Etonify Core ${version} — Android test build"

          if gh release view "$version" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' release-state.json)" != "true" ]]; then
              echo "Refusing to replace published release ${version}" >&2
              exit 1
            fi
            gh release edit "$version" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release/ETONIFY_RELEASE_NOTES.md
          else
            gh release create "$version" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release/ETONIFY_RELEASE_NOTES.md
          fi

          gh release upload "$version" dist/* --clobber
